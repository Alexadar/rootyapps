name: bigpinkcat.swift
options:
  bundleIdPrefix: oleksandr.aisixteen
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: LSKNNBG94G
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: YES

packages:
  TensorKit:
    path: Kits/Tensor/TensorKit
  DetMathKit:
    path: Kits/DetMath/DetMathKit
  RelativityKit:
    path: Kits/Relativity/RelativityKit
  PortalKit:
    path: Kits/Portal/PortalKit
  StoryKit:
    path: Kits/Story/StoryKit

targets:
  bigpinkcat.swift:
    type: application
    supportedDestinations: [iOS, macOS]
    dependencies:
      - package: TensorKit
        product: TensorKit
      - package: DetMathKit
        product: DetMathKit
      - package: RelativityKit
        product: RelativityKit
      - package: PortalKit
        product: PortalKit
      - package: StoryKit
        product: StoryKit
    sources:
      - path: BigPinkCat
        excludes:
          - "output_story/**"
      # A FOLDER REFERENCE, not a group. `output_story/video/{char1,char2,style}/` each contain a
      # `latest.mp4` and a `latest_u_d.mp4`; as a group those flatten into Resources and Xcode fails
      # with "Multiple commands produce .../latest.mp4". A folder reference preserves the tree, which
      # is also what StoryLoader.bundledDirectory expects to find.
      - path: BigPinkCat/output_story
        type: folder
        buildPhase: resources
      - path: liquid_icon.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.bigpinkcat
        # "Swift" is an Apple trademark — App Review 5.2.5 rejects it in the shipped app name or
        # binary. The target is named bigpinkcat.swift (internal only), and CFBundleName is always
        # $(PRODUCT_NAME) — INFOPLIST_KEY_CFBundleName is not a supported key — so PRODUCT_NAME
        # itself must carry the shipped name or the macOS menu bar reads "bigpinkcat.swift".
        # This repo has been rejected for exactly this three times (docs/HANDOFF_storypole.md).
        # The bundle identifier must NOT change: the ASC record (6497066161) already exists and
        # changing it would orphan existing installs.
        PRODUCT_NAME: "Big Pink Cat"
        # Pin the module name. It otherwise derives from PRODUCT_NAME ("Big Pink Cat" →
        # Big_Pink_Cat), so renaming the product silently breaks `@testable import` in the tests.
        PRODUCT_MODULE_NAME: BigPinkCat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Big Pink Cat
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.role-playing-games
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": bigpinkcat-macOS.entitlements

  BigPinkCatTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: BigPinkCatTests
    dependencies:
      - target: bigpinkcat.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # TEST_HOST defaults to the TARGET name, but the app ships as "Big Pink Cat.app" because
        # PRODUCT_NAME is overridden for Guideline 5.2.5. Without these the host path points at a
        # bundle that does not exist and every test fails to launch. Platform-conditional because
        # the executable sits at a different depth on each: macOS nests it under Contents/MacOS.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Big Pink Cat.app/Contents/MacOS/Big Pink Cat"
        "TEST_HOST[sdk=iphoneos*]": "$(BUILT_PRODUCTS_DIR)/Big Pink Cat.app/Big Pink Cat"
        "TEST_HOST[sdk=iphonesimulator*]": "$(BUILT_PRODUCTS_DIR)/Big Pink Cat.app/Big Pink Cat"
        BUNDLE_LOADER: "$(TEST_HOST)"

  BigPinkCatUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: BigPinkCatUITests
    dependencies:
      - target: bigpinkcat.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  bigpinkcat.swift:
    build:
      targets:
        bigpinkcat.swift: all
        BigPinkCatTests: [test]
        BigPinkCatUITests: [test]
    test:
      targets: [BigPinkCatTests, BigPinkCatUITests]
      gatherCoverageData: false
    run:
      config: Debug
