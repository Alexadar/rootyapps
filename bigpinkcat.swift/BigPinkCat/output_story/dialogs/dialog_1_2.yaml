    - Cat invites astronaut to walk a bit throughout the world
    - Astronaut agrrees, why not. While they walk he asked why stone looks like a stone, but wen he go closer, it changes its shape and size
    - Cat says tha he see that, and it shows for you like a stone, because it wants to
    - Astronaut says - stone thing wants things, okay good, and shapes?
    - Cat says - it have shape which between your 3 and 4 dimention, some in detween, it just want to show you that
    - Astornaut says great, why so? Stone-ish things stands calm in my , em, spacetime..?,.. but here it want ands shows it dimention
    - Cat says - Dimention(s), it varies it dimentionality to play with you
    - Astronaut says - Maybe thats our wayform?
    - Cat says - oh very good, good guess, you know how rare it is to see assumptions this quality from your kind?
    - Thats flattering, but my kind? You saw my kind?
    - Cat says - Saw or will see, not sure which spacetime it is and how it flows but this smells familiar to me, okay stone actually likes you and did a present, he gave you a waveform, what a triple coincedenc
    - Astronaut says - Great, say thank you
    - Cat says - oh no, thats an offence in this interactional comunication
    - Cat continues, but it smell your gratitude, okay it gives some options to you, choose one
    - Options of phase_2_option_2:
      - Stone gives waveform but asks to tell a story
