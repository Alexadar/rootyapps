- story_dialogs:
  - character_id: 1
    character_name: Astronaut
    character_text: Red it is. Sounds confident at least.
    id: 0
  - character_id: 2
    character_name: Big Pink Cat
    character_text: Confident is one word for it. Integrating crystal with Red now. Done. It's listening.
    id: 1
  - character_id: 1
    character_name: Astronaut
    character_text: How do I speak to it?
    id: 2
  - character_id: 2
    character_name: Big Pink Cat
    character_text: Through me. Red refuses your language—says it sounds weak. I'll translate.
    id: 3
  - character_id: 1
    character_name: Astronaut
    character_text: It has preferences about language. Of course it does. Nothing surprises me anymore.
    id: 4
  - character_id: 2
    character_name: Big Pink Cat
    character_text: Red asks why you promised your friend help but never delivered.
    id: 5
  - character_id: 1
    character_name: Astronaut
    character_text: What? How does it— Tell it I was in a hurry. I prioritized the mission over personal obligations.
    id: 6
  - character_id: 2
    character_name: Big Pink Cat
    character_text: Red says that wasn't a greater good. Just convenient rationalization. But you're honest about it, which is something. It will narrow your waveform and petition spacetime on your behalf.
    id: 7
  - character_id: 1
    character_name: Astronaut
    character_text: Spacetime can be petitioned? Why didn't you just do that from the start?
    id: 8
  - character_id: 2
    character_name: Big Pink Cat
    character_text: Not every spacetime talks. Not every spacetime talks to me. Irrelevant now—do you feel that pull? Like water, you said earlier?
    id: 9
  - character_id: 1
    character_name: Astronaut
    character_text: Yes. Familiar sensation. Unshielded warp signature. Hopefully it won't tear us apart.
    id: 10
  - character_id: 2
    character_name: Big Pink Cat
    character_text: It won't. Different rules here. Red says it wishes you'd be a better person next time. Here's your crystal. We should be moving now.
    id: 11
  - character_id: 1
    character_name: Astronaut
    character_text: We're not moving. Why aren't we moving?
    id: 12
  - character_id: 2
    character_name: Big Pink Cat
    character_text: Because Red reversed the process. Changed its mind. You were thinking about your friend just now, weren't you?
    id: 13
  - character_id: 1
    character_name: Astronaut
    character_text: Are you serious? Thoughts are crimes here?
    id: 14
  - character_id: 2
    character_name: Big Pink Cat
    character_text: No crimes here. I just didn't anticipate you'd dwell on it. What do I know about humans? Never mind. We have one option left.
    id: 15
  - character_id: 1
    character_name: Astronaut
    character_text: It's strange that you anticipate things at all. Makes you seem like a person.
    id: 16
  - character_id: 2
    character_name: Big Pink Cat
    character_text: I'm not a person. That explanation would take longer than you have. Red left traces in the waveform—I can decipher a path from them.
    id: 17
  - character_id: 1
    character_name: Astronaut
    character_text: Then do it.
    id: 18
  - character_id: 2
    character_name: Big Pink Cat
    character_text: One condition. Red left a gift for you. You can only take one. Choose, and you'll be sent back immediately.
    id: 19
  - character_id: 1
    character_name: Astronaut
    character_text: Wait. Red sabotaged my return, judged me, reversed the process out of spite—and now it's offering gifts?
    id: 20
  - character_id: 2
    character_name: Big Pink Cat
    character_text: Red operates on principles I don't fully understand. Hostility and generosity aren't contradictions for it.
    id: 21
  - character_id: 1
    character_name: Astronaut
    character_text: That makes no sense.
    id: 22
  - character_id: 2
    character_name: Big Pink Cat
    character_text: Add it to the list of things you won't get answers to. That list will follow you home, I'm afraid.
    id: 23
  - character_id: 1
    character_name: Astronaut
    character_text: So I just accept the contradiction and pick a gift?
    id: 24
  - character_id: 2
    character_name: Big Pink Cat
    character_text: That's it. I have to go now. We won't see each other again. The gifts are Knowledge, Dream, Story, or Completeness.
    id: 25
  - character_id: 1
    character_name: Astronaut
    character_text: Wait—what if it doesn't work? What do these even mean?
    id: 26
  - character_id: 2
    character_name: Big Pink Cat
    character_text: It will work. Knowledge gives understanding. Dream gives forgetting. Story gives memory. Completeness gives peace. Choose quickly. Goodbye, astronaut.
    id: 27
  - character_id: 1
    character_name: Astronaut
    character_text: I...
    id: 28
    options:
    - option_text: Knowledge—I want to understand what happened
    - option_text: Dream—let me forget this ever happened
    - option_text: Story—I want to remember every detail
    - option_text: Completeness—I want peace
    final_words:
      option_1: "The astronaut returned to Earth carrying equations that shouldn't exist. Within a decade, humanity's fold drives operated at the theoretical edge of possibility—faster, cleaner, touching the fabric of spacetime itself. Scientists called it a breakthrough. He called it a gift from something that wasn't a cat."
      option_2: "The astronaut woke in the medical bay of the Europa station, convinced he'd experienced the strangest dream. The fold had been routine. The crystal data was intact. His life continued exactly as before, though sometimes at night he dreamed of pink fur and impossible colors."
      option_3: "The astronaut told his story to anyone who would listen. He wrote it down in precise detail—details he shouldn't have been able to remember. The book sold well. People found it entertaining, imaginative, clearly fiction. No one believed a word. But they couldn't stop reading."
      option_4: "The astronaut returned changed. He remembered fragments—colors, a voice, something about choices. But mostly he felt complete in a way he couldn't explain. He reconnected with old friends. He stopped rushing. He lived the rest of his life in quiet contentment, never sure why."
