- story_dialogs:
  - character_id: 1
    character_name: Astronaut
    character_text: Chromatic aberration in the visual cortex... no. The spectrometer reads real photons. This is actually happening.
    id: 0
  - character_id: 2
    character_name: Big Pink Cat
    character_text: You're hyperventilating. Inefficient use of oxygen in a suit with limited reserves, wouldn't you say?
    id: 1
  - character_id: 1
    character_name: Astronaut
    character_text: A talking cat. Of course. Because why not add hallucinations to navigational failure.
    id: 2
  - character_id: 2
    character_name: Big Pink Cat
    character_text: Not a hallucination. Not a cat either, technically. Your visual cortex is doing its best with limited reference points. I'm flattered it chose something you find comforting.
    id: 3
  - character_id: 1
    character_name: Astronaut
    character_text: The fold signature was clean. Europa to Earth, standard Alcubierre compression. I've done this route eight hundred times.
    id: 4
  - character_id: 2
    character_name: Big Pink Cat
    character_text: Eight hundred and one proved interesting. You didn't fold through spacetime. You folded past it.
    id: 5
  - character_id: 1
    character_name: Astronaut
    character_text: That's not possible. The mathematics don't allow—
    id: 6
  - character_id: 2
    character_name: Big Pink Cat
    character_text: Your mathematics. Written for your continuum. You're not in it anymore.
    id: 7
  - character_id: 1
    character_name: Astronaut
    character_text: Then where am I?
    id: 8
  - character_id: 2
    character_name: Big Pink Cat
    character_text: Between. Think of spacetime as fabric. You found a thread loose and slipped behind the weave. I can smell at least four continuum signatures on you—which one is home?
    id: 9
  - character_id: 1
    character_name: Astronaut
    character_text: Earth. 2067. Sol system, Orion Arm.
    id: 10
  - character_id: 2
    character_name: Big Pink Cat
    character_text: Poetic coordinates. Useless here. What's that crystalline structure in your cargo hold? It's resonating with something I recognize.
    id: 11
  - character_id: 1
    character_name: Astronaut
    character_text: Temporal lattice array. Stores quantum states of verified fold routes. Why?
    id: 12
  - character_id: 2
    character_name: Big Pink Cat
    character_text: Because it remembers where you came from, even if you don't know how to read it here. We can use it to build a bridge back. But the method matters—different approaches, different costs.
    id: 13
  - character_id: 1
    character_name: Astronaut
    character_text: What kind of costs?
    id: 14
  - character_id: 2
    character_name: Big Pink Cat
    character_text: Time. Information. Certainty. Possibly identity. Choose how we proceed.
    id: 15
    options:
    - option_text: Convert the crystal's energy directly into a bridge
    - option_text: Search for resonant waveforms to amplify the signal
    - option_text: Analyze the crystal's data layers for precise coordinates
    - option_text: Map this spacetime's topology first
