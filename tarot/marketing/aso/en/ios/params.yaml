  - title: "A table, a question, a deck"
    subtitle: "78 cards you handle yourself, and Apple Intelligence to read them"
  - title: "Drag each card into place"
    subtitle: "Weighted cards with real physics — not a slideshow of pictures"
  - title: "Three cards, read plainly"
    subtitle: "Four methods, from a single daily card to the Celtic Cross"
  - title: "It writes as you watch"
    subtitle: "Apple Intelligence writes it on your iPhone, and nothing ever leaves it"
  - title: "A reflection, not a prediction"
    subtitle: "No subscription or network. Requires Apple Intelligence."
