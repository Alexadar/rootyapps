# The Surprise me corpus.
#
# Content, not code. Prompts get rewritten far more often than the thing that draws them, and
# editing a wallpaper's wording should not mean opening a Swift file, recompiling, and reading a
# diff full of escaped quotes. `SurpriseMe` loads this at startup and validates it; a malformed file
# fails loudly at load rather than quietly yielding a smaller corpus.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# HOW TO EDIT THIS WITHOUT MAKING IT WORSE
#
# * **Compose within a palette, never across.** Every subject in a palette has to read correctly
#   with every light and every treatment beside it. That is the whole reason for the grouping: a
#   flat corpus multiplies out to "a gas giant's cloud bands in warm lamplight, cyanotype".
#
# * **Write for the crop.** The master is square and roughly the middle 46% of its width survives
#   the portrait crop, with a clock and a grid of icons over the top. Subjects want a quiet
#   centre-top and their interest in the texture; nothing may depend on the left or right edge.
#
# * **No people.** A face is where these models fail most visibly, and a wallpaper with a face on
#   it is a photograph.
#
# * **Keep it under ~250 characters composed.** CLIP truncates at 77 tokens without saying so, and
#   the tail is where the light and the treatment are.
#
# The categories below are the ones the large wallpaper apps organise their catalogues around —
# dark, space, city at night, abstract — plus the 2026 trends: tonal single-hue abstracts, Art Deco
# geometrics in warm jewel tones, oversized florals on moody grounds, painterly brushwork. Near
# black is the largest palette twice over: most-requested, and nearly free to display on OLED.
# ─────────────────────────────────────────────────────────────────────────────────────────────

# Complete, hand-written prompts, drawn alongside the composed ones. A composed line is still a
# formula; these are what a person would actually have typed, and they are what the control is
# really teaching.
curated:
  - "a deep space nebula in near-black, faint violet and teal gas, scattered stars"
  - "black volcanic sand with one thread of glowing lava, near-black, macro"
  - "a matte black geometric relief under raking sidelight, high contrast monochrome"
  - "bioluminescent plankton along a black shore at new moon, long exposure"
  - "the cloud bands of a gas giant, storm-swirled, large-format film"
  - "Earth's terminator line seen from orbit, city lights along the dark side"
  - "a rain-slick street reflecting neon signage, shallow depth of field, at blue hour"
  - "a narrow alley in fog under warm sodium lamps, long exposure"
  - "layered indigo gradient with soft film grain, no subject, tonal"
  - "dunes abstracted into bands of sand and bone, flat noon light"
  - "an art deco fan motif in emerald and brass, gold leaf, symmetrical"
  - "concentric arcs in oxblood and antique gold, screen-printed, flat"
  - "a single oversized peony against near-black, oil on linen, backlit"
  - "wisteria cascading through deep shade, soft focus, muted palette"
  - "an abstract watercolour bleed of ultramarine and rust on cold-press paper"
  - "one thick impasto brushstroke across raw canvas, raking light"
  - "fern fronds unfurling, macro, shallow depth of field, in low winter sun"
  - "mist moving through an old-growth canopy, backlit, large-format film"
  - "liquid chrome forms, iridescent, studio light on seamless black"
  - "an impossible staircase of cloud, soft focus, at dusk"

