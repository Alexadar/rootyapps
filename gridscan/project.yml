name: gridscan
options:
  bundleIdPrefix: oleksandr.aisixteen
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: LSKNNBG94G
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: YES

packages:
  DocumentModelKit: { path: Kits/Core/DocumentModelKit }
  TableStructureKit: { path: Kits/Structure/TableStructureKit }
  CSVExportKit: { path: Kits/Export/CSVExportKit }
  XLSXExportKit: { path: Kits/Export/XLSXExportKit }

targets:
  gridscan:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: GridScan
      - path: gridscan.icon
        buildPhase: resources
    dependencies:
      - package: DocumentModelKit
        product: DocumentModelKit
      - package: TableStructureKit
        product: TableStructureKit
      - package: CSVExportKit
        product: CSVExportKit
      - package: XLSXExportKit
        product: XLSXExportKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.gridscan
        # PRODUCT_NAME drives CFBundleName (the macOS menu-bar title) under
        # GENERATE_INFOPLIST_FILE — leaving it as the target name ships "gridscan"
        # and risks 5.2.5-style rejection. Must be the human name.
        PRODUCT_NAME: GridScan
        ASSETCATALOG_COMPILER_APPICON_NAME: gridscan
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": gridscan-macOS.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: GridScan
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "GridScan scans documents with the camera."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  gridscanUnitTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [{ path: gridscanUnitTests }]
    dependencies:
      - target: gridscan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.gridscanUnitTests
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen derives TEST_HOST from the target name; PRODUCT_NAME differs, so
        # spell it out. BUNDLE_EXECUTABLE_FOLDER_PATH is empty on iOS, Contents/MacOS on mac.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GridScan.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GridScan"
        BUNDLE_LOADER: "$(TEST_HOST)"

  gridscanUITests:
    type: bundle.ui-testing
    # [iOS] alone makes xcodebuild refuse the macOS destination outright.
    supportedDestinations: [iOS, macOS]
    sources: [{ path: gridscanUITests }]
    dependencies:
      - target: gridscan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.gridscanUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: gridscan

schemes:
  gridscan:
    build:
      targets:
        gridscan: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - gridscanUnitTests
        - gridscanUITests
    archive:
      config: Release
