name: pig

options:
  bundleIdPrefix: oleksandr.aisixteen
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: LSKNNBG94G
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: YES

targets:
  pig:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Pig
      - path: pig.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.pig

        # Guideline 5.2.5, the trap this repo has fallen into three times. With
        # GENERATE_INFOPLIST_FILE the generator always takes CFBundleName (the macOS menu-bar title)
        # from PRODUCT_NAME and silently ignores INFOPLIST_KEY_CFBundleName. Without this line the
        # product ships under the target name. It is also why this folder is `pig` and not
        # `pig.swift`.
        PRODUCT_NAME: Pig
        # Pinned so renaming the product cannot break @testable import.
        PRODUCT_MODULE_NAME: Pig

        # Ad-hoc signing, so a POC builds and runs on this machine without registering anything with
        # the developer portal. Switching to CODE_SIGN_STYLE = Automatic is the one-line change when
        # this needs a device build or a TestFlight upload — the bundle identifier above is already
        # the one it will use.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": pig-macOS.entitlements

        # The icon is `pig.icon`, an Icon Composer bundle whose one layer is a frame rendered by the
        # game itself (`Render/IconExport.swift`). Regenerate it after any change to `PigShape`.
        ASSETCATALOG_COMPILER_APPICON_NAME: pig

        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Pig
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Landscape only: the camera orbits and the paddock is wide. A landscape-only iPad app must
        # opt out of multitasking or upload fails with 90474.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  pigTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: PigTests
    dependencies:
      - target: pig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.pig.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: pig
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # Spelled out because PRODUCT_NAME ("Pig") differs from the target name ("pig"), and the
        # default TEST_HOST is built from the target name — so it points at an app that does not
        # exist. This is the cost of the 5.2.5 fix, and it is worth paying.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pig.app/Contents/MacOS/Pig"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  pig:
    build:
      targets:
        pig: all
        pigTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [pigTests]
