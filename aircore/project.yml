name: aircore
options:
  bundleIdPrefix: oleksandr.aisixteen
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: LSKNNBG94G
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: YES

# Every computation in this app lives in one of these. Nothing in the app targets does physics.
packages:
  UnitsKit:
    path: Kits/Foundation/UnitsKit
  AltitudeKit:
    path: Kits/Foundation/AltitudeKit
  FluidKit:
    path: Kits/Foundation/FluidKit
  PsychroKit:
    path: Kits/Air/PsychroKit
  HeatKit:
    path: Kits/Air/HeatKit
  FanKit:
    path: Kits/Air/FanKit
  DuctKit:
    path: Kits/Duct/DuctKit
  PipeKit:
    path: Kits/Water/PipeKit

targets:
  aircore:
    type: application
    supportedDestinations: [iOS, macOS]
    dependencies:
      - package: UnitsKit
        product: UnitsKit
      - package: AltitudeKit
        product: AltitudeKit
      - package: PsychroKit
        product: PsychroKit
      - package: HeatKit
        product: HeatKit
      - package: FanKit
        product: FanKit
      - package: DuctKit
        product: DuctKit
      - package: PipeKit
        product: PipeKit
      - target: AirCoreWatch
        embed: true                 # "Embed Watch Content" — iOS only
        platformFilter: iOS
    sources:
      - path: AirCore
      - path: DesignShared          # tokens, formatting, catalogue, settings, watch transport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.aircore
        # Guideline 5.2.5 (Apple trademarks). With GENERATE_INFOPLIST_FILE the generator always
        # takes CFBundleName — which is the macOS menu-bar title — from PRODUCT_NAME, and silently
        # ignores INFOPLIST_KEY_CFBundleName. CFBundleDisplayName only covers Finder, Dock and the
        # Home screen. This repository has had a real rejection from getting it wrong.
        PRODUCT_NAME: AirCore
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": aircore-macOS.entitlements
        # The icon is generated by tools/make_icon.swift from the real Hyland–Wexler saturation
        # curve — regenerate it there rather than editing the PNGs.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: AirCore
        # Matches the store listing's primary category, and the other calculators in this repo
        # (Kerf Calc, Storypole, TrueCourse all ship utilities).
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  AirCoreWatch:
    type: application
    # `platform:`, not `supportedDestinations:` — XcodeGen rejects watchOS in a multiplatform
    # target ("cannot contain watchOS in supportedDestinations").
    platform: watchOS
    deploymentTarget: "10.0"
    # The wrist runs one conversion and shows the last state from the phone, so it links the
    # psychrometric solver and the units — not the duct, pipe or fan Kits.
    dependencies:
      - package: PsychroKit
        product: PsychroKit
      - package: UnitsKit
        product: UnitsKit
      - package: AltitudeKit
        product: AltitudeKit
    sources:
      - path: AirCoreWatch
      - path: DesignShared          # same tokens and the SAME Localizable.xcstrings as the phone
      # The same asset catalog as the phone, so the wrist gets the same icon and accent colour
      # from one source. Without it the watch target names an AppIcon and an AccentColor that no
      # catalog in the target defines.
      - path: AirCore/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.aircore.watchkitapp
        PRODUCT_NAME: AirCore
        INFOPLIST_KEY_CFBundleDisplayName: AirCore
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: oleksandr.aisixteen.aircore
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # The view-model state space: unit switching, altitude, the known-pair selection and the
  # persistence that has to survive backgrounding. The Kits are tested in their own packages.
  aircoreUnitTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: aircoreUnitTests
    dependencies:
      - target: aircore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.aircoreUnitTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: aircore
        # Spelled out because PRODUCT_NAME ("AirCore") differs from the target name ("aircore").
        # XcodeGen derives TEST_HOST from the TARGET name, so the default points at a binary that
        # was never built and the build fails with "Could not find test host".
        # BUNDLE_EXECUTABLE_FOLDER_PATH keeps it right on both platforms: empty on iOS,
        # "Contents/MacOS" on macOS.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AirCore.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AirCore
        BUNDLE_LOADER: $(TEST_HOST)

  aircoreUITests:
    type: bundle.ui-testing
    # macOS too: the app ships on the Mac, and with [iOS] alone `xcodebuild` refuses the macOS
    # destination outright — which leaves every macOS-only accessibility trap untested on the one
    # platform where it bites.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: aircoreUITests
    dependencies:
      - target: aircore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.aircoreUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: aircore

  # The phone's UI-test target cannot reach the watch app, so the wrist needs its own. And the
  # crown IS scriptable: XCUIDevice.rotateDigitalCrown(delta:) has existed since Xcode 13, which
  # makes crown focus a regression test rather than a manual check.
  aircoreWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: aircoreWatchUITests
      # Reused in place, NOT copied, so one cross-platform fix reaches both suites.
      - path: aircoreUITests/UITestSupport.swift
    dependencies:
      - target: AirCoreWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.aircoreWatchUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AirCoreWatch

schemes:
  # `xcodebuild test -scheme aircore` must actually run tests: a scheme with no test action
  # reports success having built no test bundle.
  aircore:
    build:
      targets:
        aircore: all
        aircoreUnitTests: [test]
        aircoreUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - aircoreUnitTests
        # ReelTour is the app-preview capture driver, not a test: 30 s of scripted dwelling that
        # asserts nothing. It belongs to the reel pipeline and runs only when one is being recorded.
        - name: aircoreUITests
          skippedTests:
            - ReelTour

  AirCoreWatch:
    build:
      targets:
        AirCoreWatch: all
        aircoreWatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - aircoreWatchUITests

  # The capture driver needs a scheme that does NOT skip it. The `aircore` scheme skips ReelTour so
  # ordinary runs stay fast — and `-only-testing:` cannot override a scheme's `skippedTests`, so
  # pointing make_reel.sh at that scheme silently records an 8-second tour of nothing.
  aircoreReel:
    build:
      targets:
        aircore: all
        aircoreUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - aircoreUITests
