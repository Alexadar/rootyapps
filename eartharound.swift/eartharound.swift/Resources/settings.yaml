# Extremes Configuration

# Data types definitions
data_types:
  temperature:
    unit: celsius
    cold_threshold: -10.0
    heat_threshold: 35.0
  wind:
    unit: km/h
    extreme_threshold: 50.0
  gust:
    unit: km/h
    extreme_threshold: 70.0
  precipitation:
    unit: mm
    extreme_threshold: 5.0

# Extreme event types
extreme_types:
  - id: cold
    icon: "❄️"
    color: blue
    description: "Extreme cold temperature"
    threshold: -10.0
    unit: "°C"
    range_description: "Threshold: below -10°C"
    typical_range: "-30°C to -10°C"
  - id: heat
    icon: "🔥"
    color: red
    description: "Extreme heat temperature"
    threshold: 35.0
    unit: "°C"
    range_description: "Threshold: above 35°C"
    typical_range: "35°C to 50°C"
  - id: wind
    icon: "💨"
    color: gray
    description: "Strong wind speed"
    threshold: 50.0
    unit: "km/h"
    range_description: "Threshold: above 50 km/h"
    typical_range: "50 km/h to 100 km/h"
  - id: gust
    icon: "🌪️"
    color: purple
    description: "Extreme wind gusts"
    threshold: 70.0
    unit: "km/h"
    range_description: "Threshold: above 70 km/h"
    typical_range: "70 km/h to 150 km/h"
  - id: rain
    icon: "🌧️"
    color: cyan
    description: "Heavy precipitation"
    threshold: 5.0
    unit: "mm"
    range_description: "Threshold: above 5 mm/h"
    typical_range: "5 mm to 50 mm per hour"
  - id: geomagnetic
    icon: "🧲"
    color: green
    description: "Geomagnetic storm"
    threshold: 5.0
    unit: "Kp"
    range_description: "Threshold: Kp index ≥ 5"
    typical_range: "Kp 5 (G1) to Kp 9 (G5)"
  - id: solarWind
    icon: "☀️"
    color: orange
    description: "High-speed solar wind"
    threshold: 500.0
    unit: "km/s"
    range_description: "Threshold: above 500 km/s"
    typical_range: "500 km/s to 1000 km/s"
  - id: solarFlare
    icon: "⚡"
    color: yellow
    description: "Solar flare event"
    threshold: 0.0
    unit: "class"
    range_description: "M-class and X-class flares"
    typical_range: "M1.0 to X10+"
