platform: watch
size: [416, 496]          # Apple Watch Series 10/11 46mm — APP_WATCH_SERIES_10

# Watch captions must be far shorter than the phone's: the whole canvas is 416px wide, and
# every font is scaled by canvas_width/1242, so a long title wraps to three lines and eats
# the screenshot. Two or three words each.
paths:
  raw_folder: /Users/oleksandr/Projects/rootyapps/eartharound.swift/marketing/raw/ja/watch
  output_folder: /Users/oleksandr/Projects/rootyapps/eartharound.swift/marketing/aso/ja/watch

style:
  bg_gradient: true
  bg_color_top: '#0C111B'
  bg_color_bottom: '#080B14'
  title_color: '#E8EEF6'
  subtitle_color: '#4DF0A0'
  screenshot_zoom: 1.0
  text_row_percent: 18
  screenshot_row_percent: 82
  border_width: 4
  border_color: '#17202F'
  border_radius: 34
  text_padding: 60
  screenshot_padding: 34
texts:
  - title: "手首で Kp"
    subtitle: "いまの嵐レベル"
  - title: "Hp30 の細かさ"
    subtitle: "30分きざみ"
  - title: "太陽風とオーロラ"
    subtitle: "速度・Bz・確率"
