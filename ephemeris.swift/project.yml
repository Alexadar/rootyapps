name: ephemeris.swift
options:
  bundleIdPrefix: oleksandr.aisixteen
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: LSKNNBG94G
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: YES
packages:
  EphemerisKit:
    path: EphemerisKit
targets:
  ephemeris.swift:
    type: application
    supportedDestinations: [iOS, macOS]
    dependencies:
      - package: EphemerisKit
        product: EphemerisKit
    sources:
      - path: ephemeris
      - path: liquid_icon.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.ephemeris
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ephemeris-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: liquid_icon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Ephemeris
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  ephemerisTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: ephemerisTests
    dependencies:
      - target: ephemeris.swift
      - package: EphemerisKit
        product: EphemerisKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.ephemerisTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ephemeris.swift.app/Contents/MacOS/ephemeris.swift"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ephemeris.swift:
    build:
      targets:
        ephemeris.swift: all
    run:
      config: Debug
    test:
      targets:
        - ephemerisTests
