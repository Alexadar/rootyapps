name: ephemeris.swift
options:
  bundleIdPrefix: oleksandr.aisixteen
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: LSKNNBG94G
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "11"
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  EphemerisKit:
    path: EphemerisKit
targets:
  ephemeris.swift:
    type: application
    supportedDestinations: [iOS, macOS]
    dependencies:
      - package: EphemerisKit
        product: EphemerisKit
      # Embeds the watch app so both ship in one build and one App Store record.
      - target: EphemerisWatch
        embed: true
        platformFilter: iOS
    sources:
      - path: ephemeris
      - path: liquid_icon.icon
        buildPhase: resources
    settings:
      base:
        # The target is named "ephemeris.swift", which would otherwise make the product,
        # binary and macOS menu-bar name literally "ephemeris.swift" — App Review 5.2.5
        # rejects "Swift" in the app name. PRODUCT_NAME pins the real name.
        PRODUCT_NAME: Ephemeris
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.ephemeris
        # iOS had NO entitlements file at all until iCloud was added — only the macOS one existed.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": ephemeris-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": ephemeris-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ephemeris-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: liquid_icon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        # Hand-written, because NSUbiquitousContainers is a nested dictionary and has no
        # INFOPLIST_KEY_ form. Every INFOPLIST_KEY_* that used to live here was carried into
        # ephemeris-Info.plist verbatim — see the comment at the top of that file. Note this is
        # INFOPLIST_FILE, NOT xcodegen's `info:` key, which would generate a plist straight over it.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ephemeris-Info.plist
  # ── Watch app ────────────────────────────────────────────────────────────
  # Standalone on purpose: it computes everything itself via EphemerisKit, so it works with the
  # phone out of range. Only preferences cross from the phone, and they cross over
  # WatchConnectivity — app groups are per-device and do NOT reach the wrist.
  EphemerisWatch:
    type: application
    platform: watchOS
    dependencies:
      - package: EphemerisKit
        product: EphemerisKit
      # Embeds the complications. Without this the extension builds and is then discarded, so the
      # complication never appears in the face picker.
      - target: EphemerisWidget
        embed: true
    sources:
      - path: EphemerisWatch
      # Same Icon Composer source as the phone and Mac — one icon, three platforms, so a tweak
      # can never land on some of them and not others.
      - path: liquid_icon.icon
        buildPhase: resources
      # Shared with the phone rather than copied: the aspect palette is the same product, and a
      # second copy would drift the moment either is tweaked. The string catalog is shared for the
      # same reason — one catalogue serving both targets is what stops the same sentence being
      # translated twice and differently.
      - path: ephemeris/Views/AspectColor.swift
      - path: ephemeris/Views/ChartGeometry.swift
      - path: ephemeris/Views/ColorHex.swift
      - path: ephemeris/DesignSystem/LanguageStore.swift
      # Same backdrop as the phone. MotionParallax already no-ops off iOS, so the
      # file compiles unchanged; only the star density is platform-tuned.
      - path: ephemeris/DesignSystem/NebulaBackground.swift
      - path: ephemeris/DesignSystem/MotionParallax.swift
      - path: ephemeris/DesignSystem/NebulaPalette.swift
      # One MoonDisc, drawn identically in the app and the complication.
      - path: EphemerisWidget/DateOnlyComplications.swift
      - path: ephemeris/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Ephemeris
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.ephemeris.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: liquid_icon
        CODE_SIGN_ENTITLEMENTS: AppGroup.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Ephemeris
        INFOPLIST_KEY_WKApplication: YES
        # Companion, not watch-only — matching eartharound: the watch app ships inside the iOS
        # app record, so one listing and one price cover both. RunsIndependently keeps it usable
        # with the phone out of range, which matters because it computes everything on-device.
        # WKWatchOnly is mutually exclusive with these two and must NOT be set.
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: oleksandr.aisixteen.ephemeris
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES

  # ── Complications / widgets ──────────────────────────────────────────────
  # One extension serving watchOS and iOS: the accessory families it declares appear on the watch
  # face and on the iPhone Lock Screen, so the same code covers both.
  EphemerisWidget:
    type: app-extension
    platform: watchOS
    dependencies:
      - package: EphemerisKit
        product: EphemerisKit
    sources:
      - path: EphemerisWidget
    settings:
      base:
        PRODUCT_NAME: EphemerisWidget
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.ephemeris.watchkitapp.widgets
        CODE_SIGN_ENTITLEMENTS: AppGroup.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: EphemerisWidget-Info.plist
        SKIP_INSTALL: YES

  ephemerisTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - path: ephemerisTests
    dependencies:
      - target: ephemeris.swift
      - package: EphemerisKit
        product: EphemerisKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.ephemerisTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ephemeris.app/Contents/MacOS/Ephemeris"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ephemerisUITests:
    type: bundle.ui-testing
    # macOS too: the app ships on the Mac, so the suite has to be runnable there. Without this
    # xcodebuild refuses with "does not support My Mac's platform" and the macOS-only accessibility
    # traps can never fire.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ephemerisUITests
    dependencies:
      - target: ephemeris.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.ephemerisUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ephemeris.swift

  EphemerisWatchUITests:
    # watchOS UI testing IS supported: `XCUIDevice.shared.rotateDigitalCrown(delta:)` lives in
    # XCUIAutomation's XCUIDevice.h, gated on TARGET_OS_WATCH, since Xcode 13. It needs its OWN
    # target on `platform: watchOS` with TEST_TARGET_NAME pointing at the watch app — the phone's
    # UI-test target cannot reach it.
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: EphemerisWatchUITests
      # The support helpers, shared rather than copied — see UITestSupport.swift's header.
      - path: ephemerisUITests/UITestSupport.swift
    dependencies:
      - target: EphemerisWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.ephemeris.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: EphemerisWatch
schemes:
  EphemerisWatch:
    build:
      targets:
        EphemerisWatch: all
        EphemerisWatchUITests: [test]
    run:
      config: Debug
    # Without a test action the watch suite silently runs nothing: `build-for-testing` prints
    # success while building no test bundle, and the run reports "Executed 0 tests".
    test:
      config: Debug
      targets:
        - EphemerisWatchUITests
  ephemeris.swift:
    build:
      targets:
        ephemeris.swift: all
        ephemerisUITests: [test]
    run:
      config: Debug
    test:
      targets:
        # ephemerisUITests was missing here, so `-only-testing:ephemerisUITests` would have
        # matched nothing and reported success against zero tests.
        - ephemerisTests
        - ephemerisUITests
  ephemerisReel:
    build:
      targets:
        ephemeris.swift: all
        ephemerisUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ephemerisUITests
