name: kerfcalc.swift
options:
  bundleIdPrefix: oleksandr.aisixteen
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: LSKNNBG94G
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "4"
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: YES
packages:
  DimensionKit:
    path: Kits/Dimension/DimensionKit
  FramingKit:
    path: Kits/Framing/FramingKit
  GeometryKit:
    path: Kits/Geometry/GeometryKit
  MaterialsKit:
    path: Kits/Materials/MaterialsKit
  ConcreteKit:
    path: Kits/Concrete/ConcreteKit
  PipeKit:
    path: Kits/Pipe/PipeKit
targets:
  kerfcalc.swift:
    type: application
    supportedDestinations: [iOS, macOS]
    dependencies:
      - package: DimensionKit
        product: DimensionKit
      - package: FramingKit
        product: FramingKit
      - package: GeometryKit
        product: GeometryKit
      - package: MaterialsKit
        product: MaterialsKit
      - package: ConcreteKit
        product: ConcreteKit
      - package: PipeKit
        product: PipeKit
      # Embed the watchOS companion into the iOS app ("Embed Watch Content"). iOS only —
      # the Mac build has no watch slot. Same paid app; no separate purchase.
      - target: KerfCalcWatch
        embed: true
        platformFilter: iOS
    sources:
      - path: KerfCalc
      - path: kerfcalc.icon
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.kerfcalc
        # "Swift" is an Apple trademark — App Review 5.2.5 rejects it in the shipped app name or
        # binary. The target is named kerfcalc.swift (internal only), so PRODUCT_NAME must be
        # overridden or the binary ships as "kerfcalc.swift" and the macOS menu-bar title reads it.
        # CFBundleName drives that menu title; CFBundleDisplayName drives Finder/Dock/menu items.
        # Bundle identifier must NOT change (Apple: it would orphan existing installs).
        # CFBundleName is always $(PRODUCT_NAME) (INFOPLIST_KEY_CFBundleName is not a supported
        # key), so PRODUCT_NAME itself must read "Kerf Calc".
        #
        # It deliberately does NOT match the App Store listing name. From 1.0.3 the listing reads
        # "Kerf: Construction Calculator" — 29 of the 30 indexed characters, because Title is the
        # heaviest-weighted search field and "Kerf Calc" wasted 21 of them. That name lives in App
        # Store Connect (appInfoLocalizations.name) and never in the binary. The two are allowed to
        # differ, and should: this one is the home-screen and menu-bar label, where a long string is
        # truncated to nothing useful.
        PRODUCT_NAME: "Kerf Calc"
        # Pin the Swift module name. It otherwise derives from PRODUCT_NAME ("Kerf Calc" → Kerf_Calc),
        # so renaming the product silently breaks `@testable import` in the test targets.
        PRODUCT_MODULE_NAME: KerfCalc
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": kerfcalc-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: kerfcalc
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Kerf Calc
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  KerfCalcWatch:
    type: application
    # `platform: watchOS` (a scalar), NOT `supportedDestinations: [watchOS]` — XcodeGen rejects
    # watchOS inside a multiplatform supportedDestinations list.
    platform: watchOS
    deploymentTarget: "26.0"
    dependencies:
      - package: DimensionKit   # Convert
        product: DimensionKit
      - package: FramingKit     # Pitch, Stairs
        product: FramingKit
      - package: GeometryKit    # Concrete
        product: GeometryKit
      - package: ConcreteKit    # Rebar, Footing, Aggregate, Mortar, Grout, Hardscape
        product: ConcreteKit
      - package: PipeKit        # Grade, Offset, Rolling Offset, Cut Length
        product: PipeKit
      - package: MaterialsKit   # Roofing, Estimate, Miter, Lumber
        product: MaterialsKit
    sources:
      - path: KerfCalcWatch
      # Share, don't copy — the same tokens + tool catalog the phone compiles.
      # LaunchOverride gates the KERFCALC_TOOL deep link this target reads; without it the watch
      # would keep an ungated env back door in Release.
      - path: KerfCalc/LaunchOverride.swift
      # The picker index → Kit input mappings and the mode→hero tables. Shared, not re-switched in a
      # watch view: these are exactly the mappings `kerfcalcTests/ToolOptionsTests` and
      # `ToolHeroesTests` pin, and a second copy here would drift out from under those tests.
      - path: KerfCalc/Views/ToolOptions.swift
      - path: KerfCalc/Views/ToolHeroes.swift
      - path: KerfCalc/Views/PipeOptions.swift
      - path: KerfCalc/Views/KCColors.swift
      - path: KerfCalc/Views/ColorHex.swift
      - path: KerfCalc/Views/ToolCatalog.swift
      - path: kerfcalc.icon
        buildPhase: resources
    settings:
      base:
        # Never ".swift"/"Swift" in the shipped name — Guideline 5.2.5. CFBundleName = $(PRODUCT_NAME).
        PRODUCT_NAME: "Kerf Calc"
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.kerfcalc.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: Kerf Calc
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: oleksandr.aisixteen.kerfcalc
        # Standalone calculator: no phone data, runs on its own. (Do NOT set WKWatchOnly — it is
        # mutually exclusive with the companion keys.)
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: kerfcalc
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # watchOS UI tests. The Digital Crown IS scriptable — `XCUIDevice.shared.rotateDigitalCrown(delta:)`
  # lives in XCUIAutomation's XCUIDevice.h gated on TARGET_OS_WATCH — so the crown-focus regression gets
  # a real test rather than an eyeball pass. `platform: watchOS` (a scalar), not supportedDestinations.
  KerfCalcWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: KerfCalcWatchUITests
    dependencies:
      - target: KerfCalcWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.kerfcalc.watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KerfCalcWatch
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "4"
  kerfcalcTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: kerfcalcTests
    dependencies:
      - target: kerfcalc.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.kerfcalcTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kerf Calc.app/Kerf Calc"
        BUNDLE_LOADER: "$(TEST_HOST)"
  kerfcalcUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: kerfcalcUITests
    dependencies:
      - target: kerfcalc.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: oleksandr.aisixteen.kerfcalcUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: kerfcalc.swift
schemes:
  kerfcalc.swift:
    build:
      targets:
        kerfcalc.swift: all
        # `[test]` matters: with no test action for this bundle, `build-for-testing` prints
        # TEST BUILD SUCCEEDED having built nothing, and `-only-testing:kerfcalcUITests` runs zero
        # tests while reporting success.
        kerfcalcUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - kerfcalcTests
        - kerfcalcUITests
  # The watch app also builds inside the `kerfcalc.swift` scheme (as embedded content), but a
  # bare `xcodebuild -target KerfCalcWatch` cannot resolve the SPM Kits — package resolution is a
  # scheme-level step. This scheme is what builds, runs and screenshots the watch app on its own.
  KerfCalcWatch:
    build:
      targets:
        KerfCalcWatch: all
        KerfCalcWatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KerfCalcWatchUITests
  kerfcalcReel:
    build:
      targets:
        kerfcalc.swift: all
        kerfcalcUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - kerfcalcUITests
